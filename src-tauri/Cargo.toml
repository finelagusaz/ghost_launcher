[package]
name = "ghost-launcher"
version = "0.1.0"
description = "A ghost launcher for SSP (Ukagaka)"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT"
repository = "https://github.com/finelagusaz/ghost_launcher"
readme = "../README.md"

[lib]
name = "ghost_launcher_lib"
# rlib 単独に絞る（#201）。cdylib/staticlib を含む lib target には cargo が
# -C extra-filename を付けないため、rlib が deps/libghost_launcher_lib.rlib という
# 単一パスへ出力される。release を継承するプロファイル（bench・test --release）では
# 同じ lib が panic=abort（bin 経由・[profile.release] 由来）と panic=unwind
# （bench/test target は常に unwind 強制）の 2 unit としてビルドされ、
# この単一パスを奪い合って後勝ちになり、リンク時に panic strategy 不整合で落ちる。
# モバイル（iOS/Android）へ移植する際は staticlib/cdylib を戻したうえで、
# [profile.release] の panic 設定を見直すこと。
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = { workspace = true }
ghost-meta = { path = "../crates/ghost-meta", features = ["thumbnail", "serde"] }
sha2 = "0.10"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
rusqlite = { version = "0.32", features = ["bundled"] }
unicode-normalization = "0.1"
rayon = "1"
tokio = { version = "1", features = ["sync"] }

[features]
bench = []

[dev-dependencies]
ts-rs = "12"
criterion = "0.8"

[[bench]]
name = "search_bench"
harness = false
required-features = ["bench"]

[[bench]]
name = "scan_bench"
harness = false
required-features = ["bench"]
