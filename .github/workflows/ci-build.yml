name: CI Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run frontend tests
        run: npm test

      - name: Check UI guidelines
        run: npm run check:ui-guidelines

      - name: Test UI guideline checks
        run: npm run test:ui-guidelines-check

      - name: Test Rust crates
        run: cargo test --workspace

      - name: Verify generated types are committed
        shell: bash
        run: |
          git diff --exit-code src/types/generated/
          test -z "$(git ls-files --others --exclude-standard src/types/generated/)"

      - name: Test ghost-meta with optional features
        run: cargo test -p ghost-meta --features thumbnail,serde

      - name: Check bench harness compiles (signature drift guard)
        run: cargo check --manifest-path src-tauri/Cargo.toml --features bench --benches

      - name: Test bench_support guards
        run: cargo test --manifest-path src-tauri/Cargo.toml --features bench --lib bench_support

      # clippy 警告を 1 件でも許さない全面ゲート。writer 混入ガード（disallowed-methods）は
      # -D warnings に含意されるため（clippy 自身が "implied by -D warnings" と報告する）明示不要。
      - name: Clippy (workspace, deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # bench feature 配下のコード（bench_support・benches/）は required-features でスキップされるため
      # 別ステップで lint する。bench 限定の新 lint 素通りを防ぐ。
      - name: Clippy (bench feature, deny warnings)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --features bench --all-targets -- -D warnings
